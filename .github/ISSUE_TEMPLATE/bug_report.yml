name: Bug report
description: Report a reproducible defect in a SALT19 public repository
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a defect. Do not include credentials, customer data, private source code, or security-sensitive exploit details. Use the private security reporting path for vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is failing?
      placeholder: Describe the observed behavior clearly.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, version/commit, hardware, runtime, browser, device, or other relevant context.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, traces, failing tests, or other artifacts. Remove secrets and private data first.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that would help isolate the defect.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials and confidential information from this report.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
